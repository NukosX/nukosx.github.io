<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dose — ~/home</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#fafaf8;
  --surface:#ffffff;
  --surface2:#f3f2ef;
  --text:#1a1a18;
  --muted:#9a9890;
  --border:#e5e3de;
  --accent:#2d5a42;
  --accent-dim:rgba(45,90,66,0.07);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-weight:300;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ── SHARED NAV ── */
.site-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 40px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;
  top:0;
  z-index:100;
}

.nav-logo{
  font-size:13px;
  font-weight:300;
  color:var(--text);
  text-decoration:none;
  letter-spacing:0.02em;
}
.nav-logo span{color:var(--muted)}

.nav-links{display:flex;gap:24px;align-items:center}

.nav-link{
  font-size:12px;
  color:var(--muted);
  text-decoration:none;
  letter-spacing:0.04em;
  transition:color .2s;
  padding-bottom:2px;
}
.nav-link:hover{color:var(--text)}
.nav-link.active{
  color:var(--text);
  border-bottom:1px solid var(--text);
}

@media(max-width:480px){.site-nav{padding:14px 24px}.nav-links{gap:14px}}

/* ── SUB-HEADER ── */
.sub-header{
  padding:12px 40px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  display:flex;
  align-items:baseline;
  gap:12px;
}
.sub-header h1{
  font-family:'Instrument Serif',serif;
  font-size:1.1rem;
  font-weight:400;
  letter-spacing:-0.01em;
  color:var(--text);
}
.sub-header p{
  font-size:11px;
  color:var(--muted);
  letter-spacing:0.02em;
}
@media(max-width:480px){.sub-header{padding:10px 24px;flex-direction:column;gap:2px}}

/* ── LAYOUT ── */
.layout{
  display:flex;
  flex:1;
  min-height:0;
  overflow:hidden;
}

/* ── SIDEBAR ── */
.sidebar{
  width:280px;
  min-width:240px;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
}

.search-wrap{
  padding:12px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--surface);
  z-index:10;
}

.search-wrap input{
  width:100%;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:12px;
  font-family:'DM Mono',monospace;
  font-weight:300;
  background:var(--bg);
  color:var(--text);
  outline:none;
  transition:border-color .2s;
}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--accent)}

.cat-label{
  padding:10px 12px 4px;
  font-size:10px;
  font-weight:400;
  letter-spacing:0.1em;
  color:var(--muted);
  text-transform:uppercase;
}

.med-btn{
  display:block;
  width:100%;
  text-align:left;
  padding:9px 14px;
  background:none;
  border:none;
  font-size:12px;
  font-family:'DM Mono',monospace;
  font-weight:300;
  color:var(--text);
  cursor:pointer;
  border-left:2px solid transparent;
  transition:background .15s, border-color .15s;
}
.med-btn:hover{background:var(--surface2)}
.med-btn.active{
  background:var(--accent-dim);
  border-left-color:var(--accent);
  color:var(--accent);
  font-weight:400;
}
.med-btn .conc{
  font-size:10px;
  color:var(--muted);
  display:block;
  margin-top:1px;
}
.med-btn.active .conc{color:var(--accent);opacity:0.7}

/* ── MAIN AREA ── */
.main{
  flex:1;
  padding:24px;
  overflow-y:auto;
  background:var(--bg);
}

/* ── PLACEHOLDER ── */
.placeholder{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:60vh;
  color:var(--muted);
  gap:12px;
}
.placeholder svg{opacity:0.25}
.placeholder p{font-size:13px}
.placeholder p.small{font-size:11px}

/* ── CARDS ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
  margin-bottom:16px;
}

.card h2{
  font-family:'Instrument Serif',serif;
  font-size:1.4rem;
  font-weight:400;
  color:var(--text);
  letter-spacing:-0.01em;
}

.card .conc-tag{
  display:inline-block;
  background:var(--surface2);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:20px;
  padding:2px 10px;
  font-size:11px;
  margin-top:6px;
}

.cat-badge{
  display:inline-block;
  border-radius:20px;
  padding:2px 10px;
  font-size:10px;
  margin-left:8px;
  vertical-align:middle;
  letter-spacing:0.04em;
}

.input-row{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:16px;
}

.input-group{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.input-group label{
  font-size:10px;
  font-weight:400;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.08em;
}

.input-group input,
.input-group select{
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:13px;
  font-family:'DM Mono',monospace;
  font-weight:300;
  outline:none;
  background:var(--bg);
  color:var(--text);
  transition:border-color .2s;
}
.input-group input:focus,
.input-group select:focus{border-color:var(--accent)}

.weight-range{
  display:flex;
  align-items:center;
  gap:10px;
}
.weight-range input[type=range]{
  flex:1;
  accent-color:var(--accent);
}
.weight-range span{font-size:12px;color:var(--muted)}

.indication-select{margin-top:14px}
.indication-select label{
  font-size:10px;
  font-weight:400;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.08em;
  display:block;
  margin-bottom:5px;
}
.indication-select select{
  width:100%;
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:12px;
  font-family:'DM Mono',monospace;
  font-weight:300;
  outline:none;
  background:var(--bg);
  color:var(--text);
}
.indication-select select:focus{border-color:var(--accent)}

/* ── RESULT CARD ── */
.result-card{
  background:var(--accent);
  border-radius:10px;
  padding:20px;
  color:#fff;
  margin-top:16px;
}
.result-card .dose-label{
  font-size:10px;
  opacity:0.65;
  text-transform:uppercase;
  letter-spacing:0.1em;
}
.result-card .dose-main{
  font-family:'Instrument Serif',serif;
  font-size:2.2rem;
  font-weight:400;
  margin:6px 0 4px;
  letter-spacing:-0.02em;
}
.result-card .dose-alt{font-size:14px;opacity:0.8}
.result-card .freq{
  display:inline-block;
  background:rgba(255,255,255,0.18);
  border-radius:20px;
  padding:3px 12px;
  font-size:11px;
  margin-top:10px;
  letter-spacing:0.02em;
}
.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.result-mini{
  background:rgba(255,255,255,0.1);
  border-radius:6px;
  padding:10px 12px;
}
.result-mini .lbl{
  font-size:10px;
  opacity:0.65;
  text-transform:uppercase;
  letter-spacing:0.06em;
}
.result-mini .val{font-size:15px;font-weight:400;margin-top:3px}

/* ── NOTE / WARNING ── */
.note-card{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px 14px;
  font-size:12px;
  color:var(--text);
  margin-top:12px;
}
.note-card strong{
  display:block;
  margin-bottom:4px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.06em;
}

.no-result{
  background:var(--surface2);
  border-radius:8px;
  padding:16px;
  text-align:center;
  color:var(--muted);
  margin-top:12px;
  font-size:12px;
}

/* ── RESPONSIVE ── */
@media(max-width:680px){
  .layout{flex-direction:column;overflow:visible}
  .sidebar{width:100%;max-height:240px;border-right:none;border-bottom:1px solid var(--border)}
  .main{padding:16px}
  .result-grid{grid-template-columns:1fr}
}
</style>
</head>

const CAT_COLORS = {
  "Antimicrobial": "#2d5a42", "Analgesic / Antipyretic": "#8b3a8b",
  "Gastro-intestinal": "#2a6a2a", "Antihistamine": "#8b4a00",
  "Cough Preparation": "#0a5a6a", "Bronchodilator": "#6a1a1a",
  "Laxative": "#4a4a00"
};

let medsData   = [];
let selectedMed = null;

// ── Boot: seed Firebase if empty, then listen for live changes ──
(async () => {
  const snap = await get(medsDbRef());
  if (!snap.exists() || !snap.val() || Object.keys(snap.val()).length === 0) {
    const batch = {};
    MEDS_SEED.forEach(m => { batch[m.id] = m; });
    await set(medsDbRef(), batch);
  }
  onValue(medsDbRef(), s => {
    medsData = s.exists() ? Object.values(s.val()).filter(Boolean) : [...MEDS_SEED];
    renderList(document.getElementById('search').value.toLowerCase());
  });
})();

function filterMeds() {
  const q = document.getElementById('search').value.toLowerCase();
  renderList(q);
}

function renderList(query = '') {
  const listEl = document.getElementById('med-list');
  const cats   = [...new Set(medsData.map(m => m.category))];
  let html = '';
  cats.forEach(cat => {
    const meds = medsData.filter(m => m.category === cat &&
      (m.name.toLowerCase().includes(query) || cat.toLowerCase().includes(query) || m.concentration_label.toLowerCase().includes(query)));
    if (!meds.length) return;
    html += `<div class="cat-label">${cat}</div>`;
    meds.forEach(m => {
      html += `<button class="med-btn ${selectedMed && selectedMed.id === m.id ? 'active' : ''}" onclick="selectMed(${JSON.stringify(String(m.id))})">
        ${m.name}<span class="conc">${m.concentration_label}</span>
      </button>`;
    });
  });
  listEl.innerHTML = html || '<div style="padding:16px;font-size:12px;color:var(--muted)">ไม่พบยา / Not found</div>';
}

function selectMed(id) {
  selectedMed = medsData.find(m => String(m.id) === String(id));
  renderList(document.getElementById('search').value.toLowerCase());
  renderMain();
}

function renderMain() {
  const m = selectedMed;
  const catColor = CAT_COLORS[m.category] || 'var(--accent)';
  const indOptions = m.indications.map((ind, i) => `<option value="${i}">${ind.label}</option>`).join('');

  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div>
          <h2>${m.name}</h2>
          <span class="conc-tag">${m.concentration_label}</span>
          <span class="cat-badge" style="background:${catColor}18;color:${catColor};border:1px solid ${catColor}33">${m.category}</span>
        </div>
      </div>
      <div class="input-row">
        <div class="input-group" style="flex:1;min-width:200px;">
          <label>น้ำหนัก / Body Weight (kg)</label>
          <div class="weight-range">
            <input type="range" id="wt-slider" min="2" max="60" step="0.5" value="15" oninput="syncWeight('slider')">
            <input type="number" id="wt-num" min="0.5" max="100" step="0.5" value="15" style="width:80px" oninput="syncWeight('num')">
            <span>kg</span>
          </div>
        </div>
      </div>
      <div class="indication-select" ${m.indications.length <= 1 ? 'style="display:none"' : ''}>
        <label>Indication / ข้อบ่งใช้</label>
        <select id="ind-select" onchange="calcDose()">${indOptions}</select>
      </div>
    </div>
    <div id="result-section"></div>
  `;

  document.getElementById('wt-slider').addEventListener('input', () => syncWeight('slider'));
  document.getElementById('wt-num').addEventListener('input', () => syncWeight('num'));
  calcDose();
}

function syncWeight(src) {
  const slider = document.getElementById('wt-slider');
  const num = document.getElementById('wt-num');
  if (src === 'slider') num.value = slider.value;
  else slider.value = num.value;
  calcDose();
}

function calcDose() {
  const m = selectedMed;
  if (!m) return;
  const wt = parseFloat(document.getElementById('wt-num').value) || 0;
  const indIdx = parseInt(document.getElementById('ind-select')?.value || '0');
  const ind = m.indications[indIdx];
  const result = document.getElementById('result-section');

  if (!wt || wt <= 0) { result.innerHTML = '<div class="no-result">กรุณาใส่น้ำหนัก / Enter body weight</div>'; return; }

  let html = '';

  if (ind.fixed) {
    if (m.liquid) {
      const minMl = ind.fixed_ml_min, maxMl = ind.fixed_ml_max;
      const minTsp = +(minMl / 5).toFixed(2), maxTsp = +(maxMl / 5).toFixed(2);
      const sameVal = minMl === maxMl;
      html = buildResultCard({
        doseMain: sameVal ? `${minMl} ml` : `${minMl}–${maxMl} ml`,
        doseAlt: sameVal ? `(${fmt(minTsp)} ช้อนชา)` : `(${fmt(minTsp)}–${fmt(maxTsp)} ช้อนชา)`,
        freq: ind.freq,
        dosage: ind.dosage,
        extras: []
      });
    } else {
      const minU = ind.fixed_unit_min, maxU = ind.fixed_unit_max;
      const unit = ind.note_unit || m.unit;
      const sameVal = minU === maxU;
      html = buildResultCard({
        doseMain: sameVal ? `${fmt(minU)} ${unit}` : `${fmt(minU)}–${fmt(maxU)} ${unit}`,
        doseAlt: ind.dosage,
        freq: ind.freq,
        dosage: '',
        extras: []
      });
    }
  } else if (ind.is_tab) {
    const dayDoseMin = wt * ind.mg_min, dayDoseMax = wt * ind.mg_max;
    const dosePerMin = dayDoseMin / ind.doses_per_day, dosePerMax = dayDoseMax / ind.doses_per_day;
    const tabMin = Math.ceil(dosePerMin / ind.tab_mg), tabMax = Math.ceil(dosePerMax / ind.tab_mg);
    const maxDayMg = ind.max_dose_mg ? ind.max_dose_mg * ind.doses_per_day : null;
    html = buildResultCard({
      doseMain: `${tabMin === tabMax ? tabMin : tabMin + '–' + tabMax} tablet(s)/dose`,
      doseAlt: `(${fmt(dosePerMin)}–${fmt(dosePerMax)} mg/dose)`,
      freq: ind.freq,
      dosage: ind.dosage,
      extras: maxDayMg ? [`Max: ${maxDayMg} mg/day`] : []
    });
  } else {
    let doseMin_mg, doseMax_mg;
    if (ind.per === 'dose') {
      doseMin_mg = wt * ind.mg_min;
      doseMax_mg = wt * ind.mg_max;
    } else {
      doseMin_mg = (wt * ind.mg_min) / ind.doses_per_day;
      doseMax_mg = (wt * ind.mg_max) / ind.doses_per_day;
    }
    if (ind.max_dose_mg) { doseMin_mg = Math.min(doseMin_mg, ind.max_dose_mg); doseMax_mg = Math.min(doseMax_mg, ind.max_dose_mg); }

    if (m.liquid && m.conc_mg_per_ml) {
      const mlMin = doseMin_mg / m.conc_mg_per_ml;
      const mlMax = doseMax_mg / m.conc_mg_per_ml;
      const tspMin = mlMin / 5, tspMax = mlMax / 5;
      const same = Math.abs(mlMin - mlMax) < 0.05;
      const extras = [];
      if (ind.max_dose_mg) extras.push(`Max dose: ${ind.max_dose_mg} mg`);
      html = buildResultCard({
        doseMain: same ? `${fmt(mlMin,1)} ml` : `${fmt(mlMin,1)}–${fmt(mlMax,1)} ml`,
        doseAlt: same ? `(${fmt(tspMin,2)} ช้อนชา · ${fmt(doseMin_mg,1)} mg)` : `(${fmt(tspMin,2)}–${fmt(tspMax,2)} ช้อนชา · ${fmt(doseMin_mg,1)}–${fmt(doseMax_mg,1)} mg)`,
        freq: ind.freq,
        dosage: ind.dosage,
        extras,
        mini: [
          { label: "Per day", val: same ? `${fmt(mlMin*ind.doses_per_day,1)} ml` : `${fmt(mlMin*ind.doses_per_day,1)}–${fmt(mlMax*ind.doses_per_day,1)} ml` },
          { label: "Frequency", val: ind.freq },
          { label: "Doses/day", val: ind.doses_per_day }
        ]
      });
    } else {
      const same = Math.abs(doseMin_mg - doseMax_mg) < 0.05;
      html = buildResultCard({
        doseMain: same ? `${fmt(doseMin_mg,1)} mg/dose` : `${fmt(doseMin_mg,1)}–${fmt(doseMax_mg,1)} mg/dose`,
        doseAlt: ind.dosage,
        freq: ind.freq, dosage: '', extras: []
      });
    }
  }

  if (m.notes && m.notes.length) {
    m.notes.forEach(n => { html += `<div class="note-card"><strong>หมายเหตุ / Note</strong>${n}</div>`; });
  }

  result.innerHTML = html;
}

function buildResultCard({ doseMain, doseAlt, freq, dosage, extras = [], mini = [] }) {
  let miniHtml = '';
  if (mini.length) {
    miniHtml = `<div class="result-grid">` +
      mini.map(m => `<div class="result-mini"><div class="lbl">${m.label}</div><div class="val">${m.val}</div></div>`).join('') +
      `</div>`;
  }
  let extHtml = extras.map(e => `<div style="margin-top:8px;font-size:12px;opacity:0.75">${e}</div>`).join('');
  return `<div class="result-card">
    <div class="dose-label">ขนาดยาต่อครั้ง / Dose per administration</div>
    <div class="dose-main">${doseMain}</div>
    <div class="dose-alt">${doseAlt}</div>
    ${dosage ? `<div style="font-size:12px;opacity:0.7;margin-top:4px">${dosage}</div>` : ''}
    <span class="freq">${freq}</span>
    ${extHtml}
    ${miniHtml}
  </div>`;
}

function fmt(n, dec = 2) {
  if (n === undefined || n === null || isNaN(n)) return '–';
  const rounded = Math.round(n * Math.pow(10, dec)) / Math.pow(10, dec);
  return rounded % 1 === 0 ? rounded.toString() : rounded.toFixed(dec).replace(/\.?0+$/, '');
}

// Expose functions called from HTML attributes (required for module scripts)
window.filterMeds = filterMeds;
window.selectMed  = selectMed;
window.syncWeight = syncWeight;
window.calcDose   = calcDose;
</script>
