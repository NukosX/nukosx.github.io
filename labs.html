<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labs — ~/home</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#fafaf8;
  --surface:#ffffff;
  --surface2:#f3f2ef;
  --text:#1a1a18;
  --muted:#9a9890;
  --border:#e5e3de;
  --accent:#2d5a42;
  --accent-dim:rgba(45,90,66,0.07);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-weight:300;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ── SHARED NAV ── */
.site-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 40px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;
  top:0;
  z-index:100;
}

.nav-logo{
  font-size:13px;
  font-weight:300;
  color:var(--text);
  text-decoration:none;
  letter-spacing:0.02em;
}
.nav-logo span{color:var(--muted)}

.nav-links{display:flex;gap:24px;align-items:center}

.nav-link{
  font-size:12px;
  color:var(--muted);
  text-decoration:none;
  letter-spacing:0.04em;
  transition:color .2s;
  padding-bottom:2px;
}
.nav-link:hover{color:var(--text)}
.nav-link.active{
  color:var(--text);
  border-bottom:1px solid var(--text);
}

@media(max-width:480px){.site-nav{padding:14px 24px}.nav-links{gap:16px}}

/* ── PAGE CONTENT ── */
.page{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:48px 24px;
}

.wrapper{
  width:100%;
  max-width:640px;
}

/* ── PAGE HEADER ── */
.page-header{
  margin-bottom:32px;
  opacity:0;
  animation:in .4s ease forwards;
}

.page-header h1{
  font-family:'Instrument Serif',serif;
  font-size:clamp(1.5rem,4vw,2rem);
  font-weight:400;
  letter-spacing:-0.02em;
  color:var(--text);
  margin-bottom:6px;
}

.page-header p{
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
}

/* ── CARD ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  opacity:0;
  animation:in .4s ease .1s forwards;
}

.card-label{
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--muted);
  padding:11px 16px 9px;
  text-transform:uppercase;
  border-bottom:1px solid var(--border);
}

textarea{
  width:100%;
  min-height:220px;
  background:transparent;
  border:none;
  outline:none;
  resize:vertical;
  padding:16px;
  font-family:'DM Mono',monospace;
  font-size:13px;
  font-weight:300;
  color:var(--text);
  line-height:1.7;
}

textarea::placeholder{color:var(--muted)}

/* ── ACTIONS ── */
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
  opacity:0;
  animation:in .4s ease .2s forwards;
}

.btn{
  font-family:'DM Mono',monospace;
  font-size:13px;
  font-weight:400;
  letter-spacing:0.02em;
  border:none;
  border-radius:8px;
  cursor:pointer;
  padding:12px 20px;
  transition:all 0.15s ease;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  -webkit-tap-highlight-color:transparent;
}

.btn-primary{
  background:var(--accent);
  color:#ffffff;
}
.btn-primary:hover{background:#245048}
.btn-primary:active{transform:scale(0.98)}

.btn-secondary{
  background:var(--surface);
  color:var(--muted);
  border:1px solid var(--border);
}
.btn-secondary:hover{color:var(--text);border-color:var(--text)}
.btn-secondary:active{transform:scale(0.98)}

/* ── MODAL ── */
#modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(26,26,24,0.6);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:9999;
  padding:16px;
  backdrop-filter:blur(4px);
}

@media(min-width:480px){#modalOverlay{align-items:center}}

#modalBox{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  width:100%;
  max-width:640px;
  overflow:hidden;
  animation:slideUp 0.2s ease;
}

@keyframes slideUp{
  from{transform:translateY(20px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

#modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}

#modalHeader span{
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--accent);
  text-transform:uppercase;
}

#modalClose{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:6px;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:14px;
  -webkit-tap-highlight-color:transparent;
}
#modalClose:hover{color:var(--text)}

#modalContent{
  padding:16px;
  max-height:50vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

#modalContent pre{
  font-family:'DM Mono',monospace;
  font-size:13px;
  line-height:1.8;
  white-space:pre-wrap;
  word-break:break-word;
  color:var(--text);
}

.line-group{
  background:var(--accent-dim);
  border-left:2px solid var(--accent);
  padding:8px 12px;
  border-radius:4px;
  margin-bottom:6px;
  font-family:'DM Mono',monospace;
  font-size:13px;
  font-weight:300;
  line-height:1.8;
  color:var(--text);
}

#modalActions{
  display:flex;
  gap:10px;
  padding:12px 16px;
  border-top:1px solid var(--border);
}
#modalActions .btn{flex:1}

/* ── TOAST ── */
.copied-toast{
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  background:var(--text);
  color:#fafaf8;
  font-family:'DM Mono',monospace;
  font-size:12px;
  font-weight:400;
  padding:8px 20px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s;
  z-index:99999;
  white-space:nowrap;
  letter-spacing:0.02em;
}
.copied-toast.show{opacity:1}

/* ── FOOTER ── */
.page-footer{
  margin-top:auto;padding-top:64px;
  font-size:11px;color:var(--muted);letter-spacing:0.04em;
  opacity:0;animation:in .4s ease .35s forwards;
}

@keyframes in{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-logo">~/home<span>.html</span></a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">home</a>
    <a href="labs.html" class="nav-link active">labs</a>
    <a href="clipboard.html" class="nav-link">clipboard</a>
    <a href="dose.html" class="nav-link">dose</a>
    <a href="meds.html" class="nav-link">meds</a>
  </div>
</nav>

<div class="page">
  <div class="wrapper">

    <div class="page-header">
      <h1>Lab Simplifier</h1>
      <p>Paste a lab report and extract key values instantly.</p>
    </div>

    <div class="card">
      <div class="card-label">// paste lab report</div>
      <textarea id="rawInput" placeholder="Paste full lab report text here..."></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="processText()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 13 9 20 9"/><polygon points="13 2 2 9 13 16 2 23"/></svg>
        Transform
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        Clear
      </button>
    </div>

    <footer class="page-footer">© 2026</footer>
  </div>
</div>

<!-- Modal -->
<div id="modalOverlay" onclick="handleOverlayClick(event)">
  <div id="modalBox">
    <div id="modalHeader">
      <span>// Result</span>
      <button id="modalClose" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
    <div id="modalActions">
      <button class="btn btn-primary" onclick="copyOutput()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy All
      </button>
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<div class="copied-toast" id="toast">Copied!</div>

<script>
let finalOutput = "";

function find(pattern, raw) {
  const m = raw.match(new RegExp(pattern, "i"));
  return m ? m[1] : "";
}

function lab(label, value) {
  return value ? `${label} ${value}` : "";
}

function processText() {
  const raw = document.getElementById("rawInput").value.trim();
  if (!raw) return;

  const Hb   = find("Hemoglobin\\s+([\\d\\.]+)", raw);
  const Hct  = find("Hematocrit\\s+([\\d\\.]+)", raw);
  const Plt  = find("Platelet Count\\s+([\\d,\\.]+)", raw).replace(/,/g,"");
  const WBC  = find("WBC Count\\s+([\\d,\\.]+)", raw).replace(/,/g,"");
  const N    = find("Neutrophil\\s+([\\d\\.]+)", raw);
  const L    = find("Lymphocyte\\s+([\\d\\.]+)", raw);

  const PT   = find("PT\\s+([\\d\\.]+)", raw);
  const APTT = find("APTT\\s+([\\d\\.]+)", raw);
  const INR  = find("INR.*?\\s([\\d\\.]+)", raw);

  const Lactate = find("Lactate\\s+([\\d\\.]+)", raw);

  const BUN  = find("Blood Urea Nitrogen\\s+([\\d\\.]+)", raw);
  const Cr   = find("Creatinine\\s+([\\d\\.]+)", raw);
  const Na   = find("Sodium\\s+([\\d\\.]+)", raw);
  const K    = find("Potassium\\s+([\\d\\.]+)", raw);
  const Cl   = find("Chloride\\s+([\\d\\.]+)", raw);
  const HCO3 = find("TCO2\\s+([\\d\\.]+)", raw);

  const Mg   = find("Magnesium\\s+([\\d\\.]+)", raw);
  const Ca   = find("Calcium\\s+([\\d\\.]+)", raw);
  const PO   = find("Phosphorus\\s+([\\d\\.]+)", raw);

  const TP   = find("Total Protein\\s+([\\d\\.]+)", raw);
  const Alb  = find("Albumin\\s+([\\d\\.]+)", raw);
  const Glb  = find("Globulin\\s+([\\d\\.]+)", raw);
  const TB   = find("Total Bilirubin\\s+([\\d\\.]+)", raw);
  const DB   = find("Direct Bilirubin\\s+([\\d\\.]+)", raw);

  const AST  = find("SGOT \\(AST\\)\\s+([\\d\\.]+)", raw);
  const ALT  = find("SGPT2 \\(ALT\\)\\s+([\\d\\.]+)", raw);
  const ALP  = find("Alkaline Phosphatase\\s+([\\d\\.]+)", raw);

  const lines = [
    [lab("Hb",Hb), lab("Hct",Hct), lab("Plt",Plt), lab("WBC",WBC), lab("N",N), lab("L",L)],
    [lab("BUN",BUN), lab("Cr",Cr), lab("Na",Na), lab("K",K), lab("Cl",Cl), lab("HCO3",HCO3)],
    [lab("Ca",Ca), lab("PO4",PO), lab("Mg",Mg), lab("Lactate",Lactate)],
    [lab("PT",PT), lab("PTT",APTT), lab("INR",INR)],
    [lab("Alb",Alb), lab("Glb",Glb), lab("TB",TB), lab("DB",DB)],
    [lab("AST",AST), lab("ALT",ALT), lab("ALP",ALP)]
  ].map(g => g.filter(Boolean).join(" ")).filter(l => l.length > 0);

  finalOutput = lines.join("\n");

  const container = document.getElementById("modalContent");
  container.innerHTML = lines.map(l =>
    `<div class="line-group">${escapeHtml(l)}</div>`
  ).join("");

  document.getElementById("modalOverlay").style.display = "flex";
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function closeModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById("modalOverlay")) closeModal();
}

function copyOutput() {
  if (!finalOutput) return;
  navigator.clipboard.writeText(finalOutput).then(() => {
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  });
}

function clearAll() {
  document.getElementById("rawInput").value = "";
  finalOutput = "";
  document.getElementById("modalContent").innerHTML = "";
  closeModal();
}
</script>
</body>
</html>
