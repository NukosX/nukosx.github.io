<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meds — ~/home</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#fafaf8; --surface:#ffffff; --surface2:#f3f2ef;
  --text:#1a1a18; --muted:#9a9890; --border:#e5e3de;
  --accent:#2d5a42; --accent-dim:rgba(45,90,66,0.07);
  --red:#c0392b; --red-dim:rgba(192,57,43,0.07);
}

body{font-family:'DM Mono',monospace;font-weight:300;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── NAV ── */
.site-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;flex-shrink:0}
.nav-logo{font-size:13px;font-weight:300;color:var(--text);text-decoration:none;letter-spacing:0.02em}
.nav-logo span{color:var(--muted)}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-link{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:0.04em;transition:color .2s;padding-bottom:2px}
.nav-link:hover{color:var(--text)}
.nav-link.active{color:var(--text);border-bottom:1px solid var(--text)}
@media(max-width:480px){.site-nav{padding:14px 24px}.nav-links{gap:14px}}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;min-height:0;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:260px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-head{padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-add{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:0.02em;transition:opacity .2s}
.btn-add:hover{opacity:0.85}
.med-count{font-size:10px;color:var(--muted);margin-left:auto}
.search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Mono',monospace;font-weight:300;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--accent)}
#med-list{flex:1;overflow-y:auto}
.cat-label{padding:10px 12px 4px;font-size:10px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase}
.med-row{display:block;width:100%;text-align:left;padding:8px 14px;background:none;border:none;font-family:'DM Mono',monospace;font-weight:300;cursor:pointer;border-left:2px solid transparent;transition:background .15s,border-color .15s}
.med-row:hover{background:var(--surface2)}
.med-row.active{background:var(--accent-dim);border-left-color:var(--accent)}
.med-row-name{display:block;font-size:12px;color:var(--text)}
.med-row.active .med-row-name{color:var(--accent);font-weight:400}
.med-row-conc{display:block;font-size:10px;color:var(--muted);margin-top:1px}
.list-empty{padding:16px;font-size:12px;color:var(--muted)}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;background:var(--bg)}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70%;color:var(--muted);gap:8px}
.placeholder svg{opacity:0.25}
.placeholder p{font-size:13px}
.placeholder p.small{font-size:11px}

/* ── FORM ── */
.form-wrap{padding:28px;max-width:740px}
.form-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.form-title{font-family:'Instrument Serif',serif;font-size:1.5rem;font-weight:400;letter-spacing:-0.01em;line-height:1.2}
.form-subtitle{font-size:11px;color:var(--muted);margin-top:3px}
.form-header-btns{display:flex;gap:8px;flex-shrink:0}

/* ── FORM SECTIONS ── */
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:14px}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-group.full{grid-column:1/-1}
.field-group label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)}
.field-group input,.field-group select,.field-group textarea{
  border:1px solid var(--border);border-radius:6px;padding:8px 10px;
  font-size:12px;font-family:'DM Mono',monospace;font-weight:300;
  background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;width:100%}
.field-group input:focus,.field-group select:focus,.field-group textarea:focus{border-color:var(--accent)}
.field-group textarea{resize:vertical;min-height:60px}

/* ── TYPE TOGGLE ── */
.type-row{display:flex;gap:8px}
.type-btn{padding:6px 16px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Mono',monospace;background:var(--bg);color:var(--muted);cursor:pointer;transition:all .15s}
.type-btn:hover{border-color:var(--accent);color:var(--accent)}
.type-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── INDICATION CARDS ── */
.ind-card{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.ind-header{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface2)}
.ind-num{font-size:10px;color:var(--muted);min-width:18px;font-weight:400}
.ind-label-preview{flex:1;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ind-actions{display:flex;gap:4px;flex-shrink:0}
.ind-btn{border:none;background:none;cursor:pointer;font-size:13px;color:var(--muted);padding:2px 5px;border-radius:4px;transition:color .15s,background .15s;font-family:inherit;line-height:1}
.ind-btn:hover{color:var(--text);background:var(--border)}
.ind-btn.danger:hover{color:var(--red);background:var(--red-dim)}
.ind-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-fields{grid-column:1/-1;display:none;grid-template-columns:1fr 1fr;gap:10px}
.type-fields.visible{display:grid}

/* ── NOTES ── */
.note-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.note-input{flex:1;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;font-family:'DM Mono',monospace;font-weight:300;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.note-input:focus{border-color:var(--accent)}
.note-del{border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0 4px;line-height:1;transition:color .15s}
.note-del:hover{color:var(--red)}

/* ── ADD ROW BUTTON ── */
.add-row-btn{width:100%;padding:9px;border:1px dashed var(--border);border-radius:6px;background:none;font-size:12px;font-family:'DM Mono',monospace;color:var(--muted);cursor:pointer;transition:all .15s;margin-top:4px}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── BUTTONS ── */
.btn{padding:8px 18px;border-radius:6px;font-size:12px;font-family:'DM Mono',monospace;border:1px solid transparent;cursor:pointer;transition:all .15s;letter-spacing:0.02em}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:0.85}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{border-color:var(--text)}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:rgba(192,57,43,0.2)}
.btn-danger:hover{background:var(--red);color:#fff}
.form-actions{display:flex;gap:10px;padding-top:4px;flex-wrap:wrap}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);font-size:12px;padding:8px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:680px){.fields-grid{grid-template-columns:1fr}.form-wrap{padding:16px}}
</style>
</head>

];

const CAT_ORDER = ["Antimicrobial","Analgesic / Antipyretic","Gastro-intestinal","Antihistamine","Cough Preparation","Bronchodilator","Laxative"];

// ── State ──
let allMeds     = [];
let selectedId  = null;
let editingInds = [];
let editingNotes= [];
let isLiquid    = true;

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// ── Boot ──
(async () => {
  const snap = await get(medsDbRef());
  if (!snap.exists() || !snap.val() || Object.keys(snap.val()).length === 0) {
    const batch = {};
    MEDS_SEED.forEach(m => { batch[m.id] = m; });
    await set(medsDbRef(), batch);
  }
  onValue(medsDbRef(), s => {
    allMeds = s.exists() ? Object.values(s.val()).filter(Boolean) : [];
    document.getElementById('medCount').textContent = `${allMeds.length} med${allMeds.length !== 1 ? 's' : ''}`;
    renderList();
    // refresh form if selected med was updated (but don't override unsaved edits)
  });
})();

// ── List ──
function renderList(query = '') {
  const q = query.toLowerCase();
  const list = document.getElementById('med-list');
  const cats = [...new Set([...CAT_ORDER, ...allMeds.map(m => m.category)])];
  let html = '';
  cats.forEach(cat => {
    const meds = allMeds.filter(m => m.category === cat &&
      (!q || m.name.toLowerCase().includes(q) || cat.toLowerCase().includes(q)));
    if (!meds.length) return;
    html += `<div class="cat-label">${cat}</div>`;
    meds.forEach(m => {
      html += `<button class="med-row${String(m.id) === String(selectedId) ? ' active' : ''}" onclick="selectMed('${m.id}')">
        <span class="med-row-name">${esc(m.name)}</span>
        <span class="med-row-conc">${esc(m.concentration_label)}</span>
      </button>`;
    });
  });
  list.innerHTML = html || `<div class="list-empty">No medications found</div>`;
}

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));
document.getElementById('addBtn').addEventListener('click', newMed);

// ── New medication ──
function newMed() {
  selectedId = null;
  isLiquid   = true;
  editingInds = [blankInd()];
  editingNotes = [];
  renderForm(null);
  renderList();
}
window.newMed = newMed;

// ── Select existing ──
function selectMed(id) {
  selectedId = id;
  const med  = allMeds.find(m => String(m.id) === String(id));
  if (!med) return;
  isLiquid    = med.liquid !== false;
  editingInds = (med.indications || []).map(ind => ({ ...flattenInd(ind) }));
  editingNotes = [...(med.notes || [])];
  renderForm(med);
  renderList();
}
window.selectMed = selectMed;

// ── Detect indication type ──
function detectIndType(ind) {
  if (ind.fixed) return (ind.fixed_ml_min !== undefined || ind.fixed_ml_max !== undefined) ? 'fixed_liquid' : 'fixed_tablet';
  if (ind.is_tab) return 'mg_kg_tablet';
  return 'mg_kg';
}

// Flatten ind to a form-friendly flat object with a `type` key
function flattenInd(ind) {
  return {
    type: detectIndType(ind),
    label: ind.label ?? '',
    dosage: ind.dosage ?? '',
    freq: ind.freq ?? '',
    doses_per_day: ind.doses_per_day ?? 1,
    per: ind.per ?? 'day',
    mg_min: ind.mg_min ?? '',
    mg_max: ind.mg_max ?? '',
    max_dose_mg: ind.max_dose_mg ?? '',
    fixed_ml_min: ind.fixed_ml_min ?? '',
    fixed_ml_max: ind.fixed_ml_max ?? '',
    fixed_unit_min: ind.fixed_unit_min ?? '',
    fixed_unit_max: ind.fixed_unit_max ?? '',
    note_unit: ind.note_unit ?? 'tablet',
    tab_mg: ind.tab_mg ?? '',
  };
}

function blankInd() {
  return { type:'mg_kg', label:'', dosage:'', freq:'', doses_per_day:1, per:'day', mg_min:'', mg_max:'', max_dose_mg:'', fixed_ml_min:'', fixed_ml_max:'', fixed_unit_min:'', fixed_unit_max:'', note_unit:'tablet', tab_mg:'' };
}

    </div>
  </div>`;

  // Wire buttons
  document.getElementById('saveBtn').onclick  = saveMed;

    document.getElementById('main').innerHTML = `<div class="placeholder"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg><p>Select a medication to edit</p><p class="small">or click + Add to create one</p></div>`;
    renderList();
  };
  if (document.getElementById('delBtn'))  document.getElementById('delBtn').onclick  = confirmDelete;
  if (document.getElementById('delBtn2')) document.getElementById('delBtn2').onclick = confirmDelete;
  document.getElementById('addIndBtn').onclick  = addInd;

// ── Liquid toggle ──
function setLiquid(val) {
  isLiquid = val;
  document.getElementById('btn-liquid')?.classList.toggle('active', val);
  document.getElementById('btn-tablet')?.classList.toggle('active', !val);
  const cmg = document.getElementById('conc-ml-group');
  if (cmg) cmg.style.display = val ? '' : 'none';
  const unitEl = document.getElementById('f-unit');
  if (unitEl) {
    if (val && unitEl.value === 'tablet') unitEl.value = 'ml';
    if (!val && unitEl.value === 'ml')    unitEl.value = 'tablet';
  }
}
window.setLiquid = setLiquid;

// ── Sync indications from DOM ──
function syncInds() {
  document.querySelectorAll('.ind-card').forEach((card, i) => {
    if (!editingInds[i]) return;
    const gv = f => card.querySelector(`[data-field="${f}"]`)?.value ?? '';
    editingInds[i] = {
      ...editingInds[i],
      label: gv('label'), dosage: gv('dosage'), freq: gv('freq'),
      doses_per_day: gv('doses_per_day'), type: gv('type'),
      per: gv('per'), mg_min: gv('mg_min'), mg_max: gv('mg_max'),
      max_dose_mg: gv('max_dose_mg'), fixed_ml_min: gv('fixed_ml_min'),
      fixed_ml_max: gv('fixed_ml_max'), fixed_unit_min: gv('fixed_unit_min'),
      fixed_unit_max: gv('fixed_unit_max'), note_unit: gv('note_unit'),
      tab_mg: gv('tab_mg'),
    };
  });
}

// ── Indication live updates (no re-render) ──
function indLabelUpdate(idx, val) {
  const preview = document.querySelector(`.ind-card[data-idx="${idx}"] .ind-label-preview`);
  if (preview) preview.textContent = val || '(no label)';
}
window.indLabelUpdate = indLabelUpdate;

function changeIndType(idx, newType) {
  syncInds();
  editingInds[idx] = { ...editingInds[idx], type: newType };
  const card = document.querySelector(`.ind-card[data-idx="${idx}"]`);
  if (!card) return;
  card.querySelectorAll('.type-fields').forEach(div => {
    div.classList.toggle('visible', div.dataset.type === newType);
  });
}
window.changeIndType = changeIndType;

// ── Add / Remove / Move indications ──
function addInd() {
  syncInds();
  editingInds.push(blankInd());
  renderInds();
  document.querySelector(`.ind-card[data-idx="${editingInds.length-1}"] [data-field="label"]`)?.focus();
}
window.addInd = addInd;

function removeInd(idx) {
  syncInds();
  editingInds.splice(idx, 1);
  renderInds();
}
window.removeInd = removeInd;

function moveInd(idx, dir) {
  syncInds();
  const other = idx + dir;
  if (other < 0 || other >= editingInds.length) return;
  [editingInds[idx], editingInds[other]] = [editingInds[other], editingInds[idx]];
  renderInds();
}
window.moveInd = moveInd;

// ── Render indication cards ──

  if (!container) return;

    <div class="ind-card" data-idx="${i}">
      <div class="ind-header">
        <span class="ind-num">${i + 1}</span>
        <span class="ind-label-preview">${esc(ind.label) || '(no label)'}</span>

          <button class="ind-btn" onclick="moveInd(${i},-1)" title="Move up" ${i===0?'disabled':''}>↑</button>
          <button class="ind-btn" onclick="moveInd(${i},1)"  title="Move down" ${i===editingInds.length-1?'disabled':''}>↓</button>
          <button class="ind-btn danger" onclick="removeInd(${i})" title="Remove">×</button>

      </div>
      <div class="ind-body">
        <div class="field-group">
          <label>Label</label>

          <div class="field-group"><label>Units max</label><input type="number" data-field="fixed_unit_max" value="${ind.fixed_unit_max}" step="any" min="0"></div>
          <div class="field-group"><label>Unit label</label><input type="text" data-field="note_unit" value="${esc(ind.note_unit)}" placeholder="tablet, capsule…"></div>
          <div class="field-group"></div>
        </div>

        <div class="type-fields${t==='mg_kg_tablet'?' visible':''}" data-type="mg_kg_tablet">

// ── Sync notes ──
function syncNotes() {
  editingNotes = [...document.querySelectorAll('.note-input')].map(el => el.value).filter(v => v.trim());
}

function addNote() {
  syncNotes();
  editingNotes.push('');
  renderNotes();
  [...document.querySelectorAll('.note-input')].slice(-1)[0]?.focus();
}
window.addNote = addNote;

function removeNote(idx) {
  syncNotes();
  editingNotes.splice(idx, 1);
  renderNotes();
}
window.removeNote = removeNote;

function renderNotes() {
  const container = document.getElementById('notes-container');
  if (!container) return;
  container.innerHTML = editingNotes.map((note, i) => `
    <div class="note-row">
      <input class="note-input" type="text" value="${esc(note)}" placeholder="e.g. Max: 4 g/day">
      <button class="note-del" onclick="removeNote(${i})" title="Remove">×</button>
    </div>`).join('');
}

// ── Build indication object for Firebase ──
function buildIndObj(ind) {
  const num = v => v !== '' && v !== null && v !== undefined ? parseFloat(v) : null;
  const base = {
    label: ind.label,
    dosage: ind.dosage,
    freq: ind.freq,
    doses_per_day: num(ind.doses_per_day) ?? 1,
  };
  switch (ind.type) {
    case 'mg_kg':
      return { ...base, mg_min: num(ind.mg_min), mg_max: num(ind.mg_max), per: ind.per || 'day', max_dose_mg: num(ind.max_dose_mg) };
    case 'fixed_liquid':
      return { ...base, fixed: true, fixed_ml_min: num(ind.fixed_ml_min), fixed_ml_max: num(ind.fixed_ml_max) };
    case 'fixed_tablet':
      return { ...base, fixed: true, fixed_unit_min: num(ind.fixed_unit_min), fixed_unit_max: num(ind.fixed_unit_max), note_unit: ind.note_unit || 'tablet' };
    case 'mg_kg_tablet':
      return { ...base, is_tab: true, mg_min: num(ind.mg_min), mg_max: num(ind.mg_max), per: 'day', max_dose_mg: num(ind.max_dose_mg), tab_mg: num(ind.tab_mg) };
    default:
      return base;
  }
}

// ── Save ──
async function saveMed() {
  syncInds();
  syncNotes();

  const name = document.getElementById('f-name')?.value.trim();
  if (!name) { showToast('Name is required'); return; }

  const concMl = document.getElementById('f-conc-ml')?.value;
  const id = selectedId ?? genId();

  const med = {
    id,
    name,
    category: document.getElementById('f-category')?.value.trim() || 'Uncategorized',
    concentration_label: document.getElementById('f-conc-label')?.value.trim() || '',
    liquid: isLiquid,
    conc_mg_per_ml: isLiquid && concMl !== '' ? parseFloat(concMl) : null,
    unit: document.getElementById('f-unit')?.value.trim() || (isLiquid ? 'ml' : 'tablet'),
    indications: editingInds.map(buildIndObj),
    notes: editingNotes.filter(n => n.trim()),
  };

  try {
    await set(medDbRef(id), med);
    selectedId = id;
    showToast('Saved');
    renderList();
  } catch(e) {
    console.error(e);
    showToast('Save failed — check Firebase rules');
  }
}
window.saveMed = saveMed;

// ── Delete ──
async function confirmDelete() {
  if (!selectedId) return;
  const med = allMeds.find(m => String(m.id) === String(selectedId));
  if (!confirm(`Delete "${med?.name}"? This cannot be undone.`)) return;
  try {
    await remove(medDbRef(selectedId));
    selectedId  = null;
    editingInds = [];
    editingNotes= [];
    document.getElementById('main').innerHTML = `<div class="placeholder"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg><p>Medication deleted</p><p class="small">Select another or click + Add</p></div>`;
    renderList();
    showToast('Deleted');
  } catch(e) {
    showToast('Delete failed');
  }
}
window.confirmDelete = confirmDelete;

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ── XSS escape ──
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
